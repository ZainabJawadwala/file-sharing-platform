<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>List My Files</title>
  <style>body{font-family:Segoe UI,Arial;padding:24px} .card{max-width:700px;background:#fff;padding:18px;border-radius:8px;border:1px solid #e3e6ee} button,input{padding:10px;margin:6px 0;width:100%;box-sizing:border-box} ul{list-style:none;padding:0} li{padding:8px;border-bottom:1px solid #eef;} .preview-box{margin-top:18px;padding:14px;border:1px solid #ddd;border-radius:8px;background:#f9f9fb} .preview-box h3{margin-top:0} .preview-image{max-width:100%;height:auto;border-radius:6px} .preview-frame{width:100%;height:500px;border:1px solid #ddd;border-radius:6px} .download-link{display:inline-block;margin-top:10px;color:#1a73e8;text-decoration:none;font-weight:600} .file-select-button{width:auto;padding:8px 12px;margin-right:10px;border:1px solid #667eea;border-radius:6px;background:#fff;color:#333;cursor:pointer} .file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf;}</style>
</head>
<body>
  <div class="card">
    <h2>Show my files</h2>
    <p>Paste your token here and click "Get files"</p>
    <input id="token" placeholder="Paste Bearer token (if required)" />
    <button id="listBtn">Get files</button>
    <div id="result"></div>
    <div id="preview" class="preview-box">
      <h3>File preview</h3>
      <div id="preview-content">Select a file to preview or download.</div>
    </div>
  </div>
  <script>
    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function showPreview(filename) {
      const previewContent = document.getElementById('preview-content');
      const url = '/uploads/' + encodeURIComponent(filename);
      const ext = filename.split('.').pop().toLowerCase();
      const imageTypes = ['png', 'jpg', 'jpeg', 'gif', 'webp'];
      const pdfTypes = ['pdf'];
      const textTypes = ['txt', 'md', 'json', 'csv', 'py', 'html', 'js', 'css'];

      previewContent.innerHTML = `<p>Loading preview for <strong>${escapeHtml(filename)}</strong>…</p>`;

      if (imageTypes.includes(ext)) {
        previewContent.innerHTML = `<img src="${url}" alt="${escapeHtml(filename)}" class="preview-image">`;
      } else if (pdfTypes.includes(ext)) {
        previewContent.innerHTML = `<iframe src="${url}" class="preview-frame"></iframe>`;
      } else if (textTypes.includes(ext)) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('Unable to load file');
          const text = await res.text();
          previewContent.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
        } catch (err) {
          previewContent.innerHTML = `<p>Preview failed: ${escapeHtml(err.message)}</p>`;
        }
      } else {
        previewContent.innerHTML = `<p>No preview available for this file type.</p>`;
      }

      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.target = '_blank';
      downloadLink.textContent = 'Download file';
      downloadLink.className = 'download-link';
      previewContent.appendChild(downloadLink);
    }

    async function log(msg){document.getElementById('result').textContent = msg}
    document.getElementById('listBtn').addEventListener('click', async ()=>{
      const token=document.getElementById('token').value.trim();
      const headers = {};
      if(token) headers['Authorization'] = token.startsWith('Bearer ')? token : ('Bearer '+token);
      document.getElementById('result').textContent = 'Loading...';
      try{
        const res = await fetch('/files/me', {headers});
        if(!res.ok) throw new Error('Request failed: '+res.status);
        const data = await res.json();
        if(Array.isArray(data) && data.length){
          const ul = document.createElement('ul');
          data.forEach(f=>{
            const li = document.createElement('li');
            li.className = 'file-row';
            const nameButton = document.createElement('button');
            nameButton.type = 'button';
            nameButton.textContent = f.filename;
            nameButton.className = 'file-select-button';
            nameButton.addEventListener('click', ()=> showPreview(f.filename));
            const downloadLink = document.createElement('a');
            downloadLink.href = '/uploads/' + encodeURIComponent(f.filename);
            downloadLink.target = '_blank';
            downloadLink.textContent = 'Download';
            downloadLink.className = 'download-link';
            li.appendChild(nameButton);
            li.appendChild(downloadLink);
            ul.appendChild(li);
          });
          document.getElementById('result').innerHTML='';
          document.getElementById('result').appendChild(ul);
        } else {
          document.getElementById('result').textContent = 'No files found.';
        }
      }catch(e){ document.getElementById('result').textContent = 'Error: '+e.message }
    })
  </script>
</body>
</html>
